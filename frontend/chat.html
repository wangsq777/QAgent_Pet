<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>和宠物聊天 - QAgent Pet</title>
    <link rel="stylesheet" href="css/chat.css?v=2">
</head>
<body>
    <div class="chat-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <button id="back-btn" class="back-btn">← 返回</button>
                <button id="memory-panel-btn" class="memory-btn">📊 记忆面板</button>
            </div>
            
            <div class="pet-info">
                <div class="pet-avatar-large" id="pet-emoji"><img src="images/hot_dog.png" alt="宠物" class="pet-avatar-img"></div>
                <h2 id="pet-name">Hot Dog</h2>
                <div class="pet-badge" id="pet-color" style="background: #ff6b6b;">Hot Dog</div>
                <span id="pet-status" class="pet-status normal">正常</span>
            </div>

            <div class="intimacy-section">
                <h3>亲密度</h3>
                <div class="intimacy-circle">
                    <svg viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="45" fill="none" stroke="#eee" stroke-width="8"/>
                        <circle id="intimacy-ring" cx="50" cy="50" r="45" fill="none" stroke="#ff6b6b" stroke-width="8"
                                stroke-dasharray="283" stroke-dashoffset="283" stroke-linecap="round"/>
                    </svg>
                    <div class="intimacy-text">
                        <span id="intimacy-value">0</span>
                        <small id="intimacy-level">陌生</small>
                    </div>
                </div>
            </div>

            <div class="stats-section">
                <div class="stat-item">
                    <span class="stat-label">累计对话</span>
                    <span id="total-chats" class="stat-value">0</span> 轮
                </div>
            </div>

            <div class="simulate-section">
                <h3>模拟控制</h3>
                <button id="simulate-day" class="simulate-btn">模拟隔天</button>
                <button id="simulate-schedule" class="simulate-btn secondary">触发日程</button>
            </div>
        </div>

        <div class="main-chat">
            <div class="chat-header">
                <span class="chat-title">和 <span id="header-pet-name">Hot Dog</span> 聊天中</span>
            </div>

            <div id="messages-container" class="messages-container">
            </div>

            <div id="loading-indicator" class="loading-indicator" style="display: none;">
                <div class="loading-dots">
                    <span></span><span></span><span></span>
                </div>
            </div>

            <div class="input-area">
                <textarea id="message-input" placeholder="输入消息..." rows="1"></textarea>
                <button id="send-btn">发送</button>
            </div>
        </div>

        <div id="memory-panel" class="memory-panel" style="display: none;">
            <h3>记忆面板</h3>
            <div class="panel-section">
                <h4>亲密度</h4>
                <p><span id="panel-intimacy">0</span> - <span id="panel-intimacy-level">陌生</span></p>
            </div>
            <div class="panel-section">
                <h4>累计对话</h4>
                <p><span id="panel-total-chats">0</span> 轮</p>
            </div>
            <div class="panel-section">
                <h4>用户画像</h4>
                <div class="profile-grid">
                    <div class="profile-item">
                        <span class="profile-label">📍 地区</span>
                        <span id="profile-region" class="profile-value">未知</span>
                        <div class="profile-actions" id="actions-region">
                            <button class="edit-btn" onclick="chatApp.editProfile('region')">✏️</button>
                        </div>
                    </div>
                    <div class="profile-item">
                        <span class="profile-label">👤 身份</span>
                        <span id="profile-identity" class="profile-value">未知</span>
                        <div class="profile-actions" id="actions-identity">
                            <button class="edit-btn" onclick="chatApp.editProfile('identity')">✏️</button>
                        </div>
                    </div>
                    <div class="profile-item">
                        <span class="profile-label">🎯 兴趣</span>
                        <span id="profile-interests" class="profile-value">未知</span>
                        <div class="profile-actions" id="actions-interests">
                            <button class="edit-btn" onclick="chatApp.editProfile('interests')">✏️</button>
                        </div>
                    </div>
                    <div class="profile-item">
                        <span class="profile-label">💼 职业</span>
                        <span id="profile-occupation" class="profile-value">未知</span>
                        <div class="profile-actions" id="actions-occupation">
                            <button class="edit-btn" onclick="chatApp.editProfile('occupation')">✏️</button>
                        </div>
                    </div>
                    <div class="profile-item">
                        <span class="profile-label">🧠 性格</span>
                        <span id="profile-personality_hint" class="profile-value">未知</span>
                        <div class="profile-actions" id="actions-personality_hint">
                            <button class="edit-btn" onclick="chatApp.editProfile('personality_hint')">✏️</button>
                        </div>
                    </div>
                    <div class="profile-item">
                        <span class="profile-label">⏰ 活跃时段</span>
                        <span id="profile-active_hours" class="profile-value">未知</span>
                        <div class="profile-actions" id="actions-active_hours">
                            <button class="edit-btn" onclick="chatApp.editProfile('active_hours')">✏️</button>
                        </div>
                    </div>
                    <div class="profile-item">
                        <span class="profile-label">💭 情绪倾向</span>
                        <span id="profile-mood_tendency" class="profile-value">未知</span>
                        <div class="profile-actions" id="actions-mood_tendency">
                            <button class="edit-btn" onclick="chatApp.editProfile('mood_tendency')">✏️</button>
                        </div>
                    </div>
                    <div class="profile-item">
                        <span class="profile-label">📝 其他</span>
                        <span id="profile-extra_info" class="profile-value">未知</span>
                        <div class="profile-actions" id="actions-extra_info">
                            <button class="edit-btn" onclick="chatApp.editProfile('extra_info')">✏️</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="panel-section">
                <h4>长期记忆</h4>
                <p class="empty-hint">暂无长期记忆</p>
            </div>
        </div>
    </div>

    <script src="js/api.js?v=2"></script>
    <script src="js/app.js?v=2"></script>
</body>
</html>
