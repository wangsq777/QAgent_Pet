<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>和宠物聊天 - QAgent Pet</title>
    <link rel="stylesheet" href="css/chat.css">
</head>
<body>
    <div class="chat-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <button id="back-btn" class="back-btn">← 返回</button>
                <button id="memory-panel-btn" class="memory-btn">📊 记忆面板</button>
            </div>
            
            <div class="pet-info">
                <div class="pet-avatar-large" id="pet-emoji">🐕</div>
                <h2 id="pet-name">Hot Dog</h2>
                <div class="pet-badge" id="pet-color" style="background: #ff6b6b;">Hot Dog</div>
                <span id="pet-status" class="pet-status normal">正常</span>
            </div>

            <div class="intimacy-section">
                <h3>亲密度</h3>
                <div class="intimacy-circle">
                    <svg viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="45" fill="none" stroke="#eee" stroke-width="8"/>
                        <circle id="intimacy-ring" cx="50" cy="50" r="45" fill="none" stroke="#ff6b6b" stroke-width="8"
                                stroke-dasharray="283" stroke-dashoffset="283" stroke-linecap="round"/>
                    </svg>
                    <div class="intimacy-text">
                        <span id="intimacy-value">0</span>
                        <small id="intimacy-level">陌生</small>
                    </div>
                </div>
            </div>

            <div class="stats-section">
                <div class="stat-item">
                    <span class="stat-label">累计对话</span>
                    <span id="total-chats" class="stat-value">0</span> 轮
                </div>
            </div>

            <div class="simulate-section">
                <h3>模拟控制</h3>
                <button id="simulate-day" class="simulate-btn">模拟隔天</button>
                <button id="simulate-schedule" class="simulate-btn secondary">触发日程</button>
            </div>
        </div>

        <div class="main-chat">
            <div class="chat-header">
                <span class="chat-title">和 <span id="header-pet-name">Hot Dog</span> 聊天中</span>
            </div>

            <div id="messages-container" class="messages-container">
            </div>

            <div id="loading-indicator" class="loading-indicator" style="display: none;">
                <div class="loading-dots">
                    <span></span><span></span><span></span>
                </div>
            </div>

            <div class="input-area">
                <textarea id="message-input" placeholder="输入消息..." rows="1"></textarea>
                <button id="send-btn">发送</button>
            </div>
        </div>

        <div id="memory-panel" class="memory-panel" style="display: none;">
            <h3>记忆面板</h3>
            <div class="panel-section">
                <h4>亲密度</h4>
                <p><span id="panel-intimacy">0</span> - <span id="panel-intimacy-level">陌生</span></p>
            </div>
            <div class="panel-section">
                <h4>累计对话</h4>
                <p><span id="panel-total-chats">0</span> 轮</p>
            </div>
            <div class="panel-section">
                <h4>长期记忆</h4>
                <p class="empty-hint">暂无长期记忆</p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
