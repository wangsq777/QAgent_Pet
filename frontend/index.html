<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择你的宠物伴侣 - QAgent Pet</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .create-custom-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3);
        }
        .create-custom-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(155, 89, 182, 0.4);
            background: linear-gradient(135deg, #a569bd, #9b59b6);
        }
        .create-custom-btn .icon {
            font-size: 18px;
        }
        .pet-card.custom-pet-user {
            position: relative;
            border: 2px dashed #9b59b6;
            background: linear-gradient(135deg, #fef0ff 0%, #f8e8ff 100%);
        }
        .pet-card.custom-pet-user .pet-emoji-icon {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 35px;
        }
        .pet-card.custom-pet-user .pet-name {
            color: #8e44ad;
        }
        .pet-card.custom-pet-user .pet-tag {
            background: linear-gradient(135deg, #9b59b6, #e74c3c);
        }
        .empty-custom-pets {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 14px;
        }
        .empty-custom-pets .icon {
            font-size: 48px;
            margin-bottom: 10px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <div>
                <h1>🐾 选择你的宠物伴侣</h1>
                <p>每只小可爱都有独特的性格，找到最适合你的那个吧！</p>
            </div>
            <button class="create-custom-btn" onclick="goToCustomPet()">
                <span class="icon">✨</span>
                <span>创建自定义宠物</span>
            </button>
        </div>

        <div class="pet-grid">
            <div class="pet-card hot-dog" data-pet-type="hot_dog">
                <img src="images/hot_dog.png" alt="Hot Dog" class="pet-emoji">
                <h2 class="pet-name">Hot Dog</h2>
                <span class="pet-tag">热情奔放</span>
                <p class="pet-desc">超级热情的小狗，见到你就摇尾巴！总是充满活力，用最热情的方式陪伴你。</p>
                <button class="select-btn" onclick="selectPet('hot_dog')">选择 Hot Dog</button>
            </div>

            <div class="pet-card cold-cat" data-pet-type="cold_cat">
                <img src="images/cold_cat.png" alt="Cold Cat" class="pet-emoji">
                <h2 class="pet-name">Cold Cat</h2>
                <span class="pet-tag">高冷细腻</span>
                <p class="pet-desc">傲娇的猫咪，嘴上不说但心里有你。观察力超强，总能注意到你的小情绪。</p>
                <button class="select-btn" onclick="selectPet('cold_cat')">选择 Cold Cat</button>
            </div>

            <div class="pet-card mouse" data-pet-type="mouse">
                <img src="images/mouse.png" alt="鼠鼠" class="pet-emoji">
                <h2 class="pet-name">鼠鼠</h2>
                <span class="pet-tag">老实憨厚</span>
                <p class="pet-desc">胆子很小但很真诚的小老鼠。会偷偷记住你说的每件小事，小心翼翼地关心你。</p>
                <button class="select-btn" onclick="selectPet('mouse')">选择 鼠鼠</button>
            </div>

            <!-- 自定义宠物将动态插入到这里 -->
        </div>

        <div class="footer">
            <p>腾讯AI产品校园大赛 | QQ智能宠物伴侣 Agent</p>
        </div>
    </div>

    <div id="loading" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    <script src="js/api.js"></script>
    <script>
        let userId = localStorage.getItem('qagent_user_id');
        if (!userId) {
            userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('qagent_user_id', userId);
        }

        // 宠物类型到 emoji 的映射（用于无预置图片时的 fallback）
        const petTypeEmoji = {
            'lion': '🦁', 'snake': '🐍',
            'cheetah': '🐆', 'deer': '🦌', 'lamb': '🐑', 'pig': '🐷',
            'horse': '🐴', 'rabbit': '🐰', 'bird': '🐦', 'fox': '🦊', 'bear': '🐻'
        };

        // 宠物类型对应的预置头像图片
        const petTypePresetImages = {
            'dog': 'images/hot_dog.png',
            'cat': 'images/cold_cat.png',
            'hamster': 'images/mouse.png',
            'panda': 'images/panda.png',
            'tiger': 'images/tiger.png',
            'lion': 'images/lion.png',
            'snake': 'images/snake.png',
            'cheetah': 'images/cheetah.png',
            'deer': 'images/deer.png',
            'lamb': 'images/lamb.png',
            'pig': 'images/pig.png',
            'horse': 'images/horse.png'
        };

        const petTypeNames = {
            'dog': '小狗',
            'cat': '小猫',
            'hamster': '小仓鼠',
            'panda': '小熊猫',
            'tiger': '小老虎',
            'lion': '小狮子',
            'snake': '小蛇',
            'cheetah': '小猎豹',
            'deer': '小鹿',
            'lamb': '小羊',
            'pig': '小猪',
            'horse': '小马',
            'rabbit': '小兔',
            'bird': '小鸟',
            'fox': '小狐狸',
            'bear': '小熊'
        };

        // 加载自定义宠物列表
        async function loadCustomPets() {
            const petGrid = document.querySelector('.pet-grid');
            
            try {
                const response = await API.listCustomPets();
                const pets = response.pets || [];
                
                if (pets.length > 0) {
                    pets.forEach(pet => {
                        const emoji = petTypeEmoji[pet.pet_type] || '🐾';
                        const typeName = petTypeNames[pet.pet_type] || pet.pet_type;
                        const personalityStr = pet.personality_tags ? pet.personality_tags.slice(0, 2).join('、') : '';
                        // 头像优先级：自定义上传 > 预置宠物图片 > emoji
                        const presetImg = petTypePresetImages[pet.pet_type] || '';
                        let avatarHtml;
                        if (pet.avatar_url) {
                            avatarHtml = `<img src="${pet.avatar_url}" alt="${pet.pet_name}" class="pet-emoji" style="width: 60px; height: 60px; object-fit: cover; border-radius: 50%;">`;
                        } else if (presetImg) {
                            avatarHtml = `<img src="${presetImg}" alt="${pet.pet_name}" class="pet-emoji" style="width: 60px; height: 60px; object-fit: cover; border-radius: 50%;">`;
                        } else {
                            avatarHtml = `<span style="font-size: 60px;">${emoji}</span>`;
                        }
                        
                        const petCard = document.createElement('div');
                        petCard.className = 'pet-card custom-pet-user';
                        petCard.dataset.petId = pet.pet_id;
                        petCard.innerHTML = `
                            ${avatarHtml}
                            <h2 class="pet-name">${pet.pet_name}</h2>
                            <span class="pet-tag">${typeName}</span>
                            <p class="pet-desc">${personalityStr ? '性格：' + personalityStr : '我的专属宠物'}</p>
                            <button class="select-btn" onclick="selectCustomPet('${pet.pet_id}', '${pet.pet_name}', '${pet.avatar_url || ''}')">选择 ${pet.pet_name}</button>
                        `;
                        
                        petGrid.appendChild(petCard);
                    });
                } else {
                    // 没有自定义宠物时显示提示
                    const emptyMsg = document.createElement('div');
                    emptyMsg.className = 'empty-custom-pets';
                    emptyMsg.id = 'emptyCustomPets';
                    emptyMsg.innerHTML = `
                        <div class="icon">🐾</div>
                        <p>还没有创建自定义宠物</p>
                        <p style="font-size: 12px; margin-top: 5px;">点击右上角「创建自定义宠物」开始</p>
                    `;
                    petGrid.appendChild(emptyMsg);
                }
            } catch (error) {
                console.log('加载自定义宠物列表失败:', error);
                // 显示空状态
                const emptyMsg = document.createElement('div');
                emptyMsg.className = 'empty-custom-pets';
                emptyMsg.innerHTML = `
                    <div class="icon">🐾</div>
                    <p>还没有创建自定义宠物</p>
                    <p style="font-size: 12px; margin-top: 5px;">点击右上角「创建自定义宠物」开始</p>
                `;
                petGrid.appendChild(emptyMsg);
            }
        }

        // 选择已有的自定义宠物
        async function selectCustomPet(petId, petName, avatarUrl) {
            const loading = document.getElementById('loading');
            loading.style.display = 'flex';

            try {
                const response = await API.createSession(userId, 'custom', petId);
                localStorage.setItem('qagent_session_id', response.session_id);
                localStorage.setItem('qagent_pet_type', response.pet_type);
                localStorage.setItem('qagent_pet_type_emoji', petTypeEmoji[response.pet_type] || '🐾');
                localStorage.setItem('qagent_custom_pet_id', petId);
                localStorage.setItem('qagent_custom_pet_name', petName);
                localStorage.setItem('qagent_welcome', JSON.stringify(response.welcome_message || {}));
                localStorage.setItem('qagent_intimacy', response.intimacy);
                // 保存自定义头像
                if (avatarUrl) {
                    localStorage.setItem('qagent_custom_avatar', avatarUrl);
                } else {
                    localStorage.removeItem('qagent_custom_avatar');
                }

                window.location.href = 'chat.html';
            } catch (error) {
                alert('创建会话失败，请重试: ' + error.message);
                loading.style.display = 'none';
            }
        }

        // 页面加载时获取自定义宠物
        document.addEventListener('DOMContentLoaded', loadCustomPets);

        async function selectPet(petType) {
            const loading = document.getElementById('loading');
            loading.style.display = 'flex';

            try {
                // 清除自定义宠物相关的 localStorage（防止残留头像影响内置宠物）
                localStorage.removeItem('qagent_custom_avatar');
                localStorage.removeItem('qagent_custom_pet');
                localStorage.removeItem('qagent_custom_pet_id');
                localStorage.removeItem('qagent_custom_pet_name');
                localStorage.removeItem('qagent_pet_type_emoji');

                const response = await API.createSession(userId, petType);
                localStorage.setItem('qagent_session_id', response.session_id);
                localStorage.setItem('qagent_pet_type', response.pet_type);
                localStorage.setItem('qagent_welcome', JSON.stringify(response.welcome_message || {}));
                localStorage.setItem('qagent_intimacy', response.intimacy);

                window.location.href = 'chat.html';
            } catch (error) {
                alert('创建会话失败，请重试: ' + error.message);
                loading.style.display = 'none';
            }
        }

        function goToCustomPet() {
            window.location.href = 'custom_pet.html';
        }
    </script>
</body>
</html>
