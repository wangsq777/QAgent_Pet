<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择你的宠物伴侣 - QAgent Pet</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐾 选择你的宠物伴侣</h1>
            <p>每只小可爱都有独特的性格，找到最适合你的那个吧！</p>
        </div>

        <div class="pet-grid">
            <div class="pet-card hot-dog" data-pet-type="hot_dog">
                <img src="images/hot_dog.png" alt="Hot Dog" class="pet-emoji">
                <h2 class="pet-name">Hot Dog</h2>
                <span class="pet-tag">热情奔放</span>
                <p class="pet-desc">超级热情的小狗，见到你就摇尾巴！总是充满活力，用最热情的方式陪伴你。</p>
                <button class="select-btn" onclick="selectPet('hot_dog')">选择 Hot Dog</button>
            </div>

            <div class="pet-card cold-cat" data-pet-type="cold_cat">
                <img src="images/cold_cat.png" alt="Cold Cat" class="pet-emoji">
                <h2 class="pet-name">Cold Cat</h2>
                <span class="pet-tag">高冷细腻</span>
                <p class="pet-desc">傲娇的猫咪，嘴上不说但心里有你。观察力超强，总能注意到你的小情绪。</p>
                <button class="select-btn" onclick="selectPet('cold_cat')">选择 Cold Cat</button>
            </div>

            <div class="pet-card mouse" data-pet-type="mouse">
                <img src="images/mouse.png" alt="鼠鼠" class="pet-emoji">
                <h2 class="pet-name">鼠鼠</h2>
                <span class="pet-tag">老实憨厚</span>
                <p class="pet-desc">胆子很小但很真诚的小老鼠。会偷偷记住你说的每件小事，小心翼翼地关心你。</p>
                <button class="select-btn" onclick="selectPet('mouse')">选择 鼠鼠</button>
            </div>

            <div class="pet-card custom-pet" data-pet-type="custom" onclick="goToCustomPet()">
                <img src="images/custom_pet.svg" alt="自定义宠物" class="pet-emoji">
                <h2 class="pet-name">自定义宠物</h2>
                <span class="pet-tag">独一无二</span>
                <p class="pet-desc">创造属于你自己的专属宠物！设定独一无二的名字和性格，打造最懂你的AI伙伴。</p>
                <button class="select-btn" onclick="event.stopPropagation(); goToCustomPet()">开始创造</button>
            </div>
        </div>

        <div class="footer">
            <p>腾讯AI产品校园大赛 | QQ智能宠物伴侣 Agent</p>
        </div>
    </div>

    <div id="loading" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    <script src="js/api.js"></script>
    <script>
        let userId = localStorage.getItem('qagent_user_id');
        if (!userId) {
            userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('qagent_user_id', userId);
        }

        async function selectPet(petType) {
            const loading = document.getElementById('loading');
            loading.style.display = 'flex';

            try {
                const response = await API.createSession(userId, petType);
                localStorage.setItem('qagent_session_id', response.session_id);
                localStorage.setItem('qagent_pet_type', response.pet_type);
                // 如果是已有session，不保存欢迎语；新session才保存
                localStorage.setItem('qagent_welcome', JSON.stringify(response.welcome_message || {}));
                localStorage.setItem('qagent_intimacy', response.intimacy);

                window.location.href = 'chat.html';
            } catch (error) {
                alert('创建会话失败，请重试: ' + error.message);
                loading.style.display = 'none';
            }
        }

        function goToCustomPet() {
            window.location.href = 'custom_pet.html';
        }
    </script>
</body>
</html>
