<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>播放 B 站视频</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 14px;
            height: 100vh;
            box-sizing: border-box;
            padding: 20px 24px;
            background: #f7f8fa;
            font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        label { font-size: 13px; color: #333; font-weight: 600; }
        input {
            box-sizing: border-box;
            width: 100%;
            height: 38px;
            padding: 0 12px;
            border: 1px solid #d0d3d8;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }
        input:focus { border-color: #46a094; }
        .row { display: flex; align-items: center; gap: 10px; }
        button {
            height: 34px;
            padding: 0 18px;
            border: none;
            border-radius: 8px;
            background: #46a094;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        button:disabled { opacity: 0.6; cursor: default; }
        #cancel { background: transparent; border: 1px solid #d0d3d8; color: #555; font-weight: 500; }
        #message { min-height: 16px; font-size: 12px; color: #c0392b; }
        #message.info { color: #7a8388; }
    </style>
</head>
<body>
    <label for="video-input">粘贴 B 站视频链接或 BV / av 号</label>
    <input id="video-input" type="text" placeholder="如 https://www.bilibili.com/video/BV…?p=2 / av170001 / b23.tv 短链" autofocus>
    <div id="message" class="info">支持完整链接、分 P、av 号与 b23.tv 短链；将在摸鱼·视频小窗中播放。</div>
    <div class="row">
        <button id="play-btn" type="button">▶ 播放</button>
        <button id="cancel" type="button">取消</button>
    </div>
    <script>
        const input = document.getElementById('video-input');
        const playBtn = document.getElementById('play-btn');
        const message = document.getElementById('message');

        function setMessage(text, isError) {
            message.textContent = text;
            message.classList.toggle('info', !isError);
        }

        async function play() {
            const value = input.value.trim();
            if (!value) {
                input.focus();
                return;
            }
            playBtn.disabled = true;
            setMessage('正在解析链接…', false);
            try {
                const result = await window.videoPromptAPI.play(value);
                if (result && result.ok) {
                    window.close();
                    return;
                }
                setMessage((result && result.error) || '解析失败，请检查链接后重试', true);
            } catch (error) {
                setMessage('播放请求失败：' + error.message, true);
            } finally {
                playBtn.disabled = false;
            }
        }

        playBtn.addEventListener('click', play);
        document.getElementById('cancel').addEventListener('click', () => window.close());
        input.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') play();
        });
        input.focus();
    </script>
</body>
</html>
